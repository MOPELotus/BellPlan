name: Check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check src tests run.py
      - run: python -m ruff format --check src tests run.py
      - run: python -m pytest -q
  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: python -m PyInstaller BellPlan.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: BellPlan-Windows
          path: dist/BellPlan.exe
