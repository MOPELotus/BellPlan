[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bellplan"
version = "0.1.1"
description = "An independently reimplemented desktop audio scheduler"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<6.9", "pycaw>=20251023; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "ruff>=0.9"]

[project.scripts]
bellplan = "bellplan.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bellplan = ["qml/*.qml", "qml/components/*.qml", "assets/manifest.json", "assets/music/*", "assets/music/*/*", "assets/help/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
